# Oracle Cloud Always Free (arm64) deployment: the bot + a Caddy reverse proxy with automatic HTTPS.
# Run from this folder:  docker compose up -d --build
name: finance-bot

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  bot:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: finance-bot:latest
    env_file: .env
    environment:
      # Always use the SQLite file on the mounted volume, whatever .env says.
      DATABASE_URL: sqlite+aiosqlite:////data/finance.db
      WEBAPP_HOST: 0.0.0.0
      PORT: "8080"
    volumes:
      - ./data:/data
    # No "ports:" on purpose: the Mini App server is reachable only from Caddy on the compose network.
    expose:
      - "8080"
    restart: unless-stopped
    logging: *default-logging

  caddy:
    image: caddy:2
    depends_on:
      - bot
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in deploy/oracle/.env, e.g. 1-2-3-4.sslip.io}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:
